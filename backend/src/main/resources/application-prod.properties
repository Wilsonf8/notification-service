spring.application.name=notification-service

# Database (Railway provides individual PG vars)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis (Railway provides individual REDIS vars)
spring.data.redis.host=${REDISHOST}
spring.data.redis.port=${REDISPORT}
spring.data.redis.password=${REDISPASSWORD}

# OAuth2 GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Apple OAuth (for iOS native token verification + web client secret generation)
oauth.apple.client-id=${APPLE_CLIENT_ID:com.liveconnect.LiveConnect}
oauth.apple.team-id=${APPLE_TEAM_ID:}
oauth.apple.key-id=${APPLE_KEY_ID:}
oauth.apple.private-key=${APPLE_PRIVATE_KEY:}

# OAuth2 Apple (web-based Sign in with Apple)
# Set APPLE_WEB_CLIENT_ID to your Services ID to enable the web flow.
# When not set, only the iOS native flow (POST /api/auth/apple/token) is available.
# spring.security.oauth2.client.registration.apple.client-id=${APPLE_WEB_CLIENT_ID}
# spring.security.oauth2.client.registration.apple.client-secret=placeholder-replaced-at-runtime
# spring.security.oauth2.client.registration.apple.scope=openid,email,name
# spring.security.oauth2.client.registration.apple.client-authentication-method=post
# spring.security.oauth2.client.registration.apple.authorization-grant-type=authorization_code
# spring.security.oauth2.client.registration.apple.redirect-uri={baseUrl}/login/oauth2/code/apple
# spring.security.oauth2.client.provider.apple.issuer-uri=https://appleid.apple.com
# spring.security.oauth2.client.provider.apple.authorization-uri=https://appleid.apple.com/auth/authorize?response_mode=form_post
# spring.security.oauth2.client.provider.apple.token-uri=https://appleid.apple.com/auth/token
# spring.security.oauth2.client.provider.apple.jwk-set-uri=https://appleid.apple.com/auth/keys
# spring.security.oauth2.client.provider.apple.user-name-attribute=sub

# Server
server.port=${PORT}
server.forward-headers-strategy=framework
server.http2.enabled=false

# App Config
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=2592000000
app.rate-limit.global-messages-per-second=25
app.rate-limit.per-chat-messages-per-second=1
app.rate-limit.ingestion-per-project-per-second=10
app.rate-limit.max-queued-per-project=10000
app.event.expiration-minutes=30

# LiveConnect Rate Limits - Per Visitor
app.liveconnect.rate-limit.visitor.in-call-message-per-min=20
app.liveconnect.rate-limit.visitor.request-call-per-min=3
app.liveconnect.rate-limit.visitor.leave-contact-per-hour=5

# LiveConnect Rate Limits - Per IP (backstop)
app.liveconnect.rate-limit.ip.widget-init-per-min=20
app.liveconnect.rate-limit.ip.in-call-message-per-min=100
app.liveconnect.rate-limit.ip.request-call-per-min=15
app.liveconnect.rate-limit.ip.leave-contact-per-hour=20

# LiveConnect Session TTL
app.liveconnect.session.ttl-hours=24

# LiveKit Cloud
app.livekit.api-key=${LIVEKIT_API_KEY}
app.livekit.api-secret=${LIVEKIT_API_SECRET}
app.livekit.url=${LIVEKIT_URL}
app.livekit.token-ttl-hours=24

# APNs Configuration (push notifications - optional, app works without)
app.apns.key-id=${APNS_KEY_ID:}
app.apns.team-id=${APNS_TEAM_ID:}
app.apns.key-content=${APNS_KEY_CONTENT:}
app.apns.bundle-id=com.liveconnect.LiveConnect
app.apns.production=false

# Stripe
app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.stripe.price-id-monthly=${STRIPE_PRICE_ID_MONTHLY}
app.stripe.price-id-weekly=${STRIPE_PRICE_ID_WEEKLY:}
app.stripe.price-id-daily=${STRIPE_PRICE_ID_DAILY:}

# GeoIP
app.geoip.database-path=${GEOIP_DB_PATH:data/GeoLite2-City.mmdb}

# Push notification throttling
app.push.presence-throttle-minutes=30
