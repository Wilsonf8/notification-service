spring.application.name=notification-service

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:notification_service}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# OAuth2 GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Server
server.port=${PORT:8081}

# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.bot.webhook-secret=${TELEGRAM_WEBHOOK_SECRET}

# App Config
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-for-development-only}
app.jwt.expiration-ms=86400000
app.rate-limit.global-messages-per-second=25
app.rate-limit.per-chat-messages-per-second=1
app.rate-limit.ingestion-per-project-per-second=10
app.rate-limit.max-queued-per-project=10000
app.event.expiration-minutes=30
